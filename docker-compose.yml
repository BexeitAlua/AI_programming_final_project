services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"   
      - "6334:6334"   
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333        
      QDRANT_API_KEY: ""
      QDRANT_COLLECTION: games
      MODELS_DIR: /app/models
    volumes:
      - ./models:/app/models:ro
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:
